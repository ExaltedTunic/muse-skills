name: "external_review_intake"
title: "External Review Intake"
description: "Verify claims from relayed outside reviews (other AIs, human reviewers, audits) against the source before acting: split into claims, check mechanically, report verified/corrected/unverifiable, and fold in only what the user approves. Use whenever the user pastes or relays a review, critique, audit, or set of recommendations produced by someone other than the agent in this conversation."
category: "Agent Workflow"
include_in_prompt: true
